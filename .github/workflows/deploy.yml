name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Faktenbericht
        run: npm run facts:check

  # Die Veröffentlichung läuft über GitHub Pages: Jeder Push auf main wird
  # geprüft, gebaut und unter https://dealwirth.github.io/GP2/ bereitgestellt.
  seiten:
    name: Seiten veröffentlichen
    needs: pruefen
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Der Schlüssel liegt als Repository-Secret und landet beim Bau in
          # der Anwendung. Im Quelltext steht er nicht – GitHub verweigert
          # sonst den Push (Push Protection).
          VITE_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
